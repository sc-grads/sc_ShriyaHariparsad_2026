name: Automated SSIS Data Migration Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    env:
      SSIS_SERVER: "SAMBE2025001"                                
      SSIS_CATALOG_FOLDER: "TimesheetMigration"                
      SSIS_PROJECT_NAME: "TimesheetMigration"
      TARGET_DATABASE: "TimesheetDB"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Visual Studio and Build SSIS Solution
        shell: powershell
        run: |
          # 1. Find Visual Studio compiler dynamically
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
          if (-not $vsPath) {
              Write-Error "Visual Studio (devenv.com) could not be located on this machine!"
              exit 1
          }
          $devenv = $vsPath.Replace("devenv.exe", "devenv.com")
          Write-Host "Using Visual Studio Compiler: $devenv"
          
          # 2. Find the Solution (.sln) file dynamically in your repository
          $slnFile = Get-ChildItem -Path . -Filter "TimesheetMigration.sln" -Recurse | Select-Object -First 1
          if ($null -eq $slnFile) {
              Write-Error "Could not find TimesheetMigration.sln anywhere in the workspace!"
              exit 1
          }
          $solutionPath = $slnFile.FullName
          Write-Host "Found Solution file at: $solutionPath"
          
          # 3. Find the compiled output folder dynamically where the .ispac will go
          $dtprojFile = Get-ChildItem -Path . -Filter "TimesheetMigration.dtproj" -Recurse | Select-Object -First 1
          if ($null -eq $dtprojFile) {
              Write-Error "Could not find TimesheetMigration.dtproj anywhere in the workspace!"
              exit 1
          }
          $ispacFolder = Join-Path $dtprojFile.DirectoryName "bin\Development"
          $ispacPath = Join-Path $ispacFolder "TimesheetMigration.ispac"
          
          # Pass this path to the next step dynamically
          echo "RESOLVED_ISPAC_PATH=$ispacPath" >> $env:GITHUB_ENV
          
          # 4. Compile the SSIS Solution
          & $devenv "$solutionPath" /Build "Development"
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Visual Studio build failed with exit code $LASTEXITCODE"
              exit 1
          }

      - name: Deploy SSIS Package to SSISDB
        shell: powershell
        run: |
          # Load the Integration Services Assembly
          [System.Reflection.Assembly]::LoadWithPartialName("Microsoft.SqlServer.Management.IntegrationServices") | Out-Null
          
          # Connect using Windows Integrated Security targeting your server instance
          $connectionString = "Data Source=${{ env.SSIS_SERVER }};Initial Catalog=${{ env.TARGET_DATABASE }};Integrated Security=True;"
          $sqlConnection = New-Object System.Data.SqlClient.SqlConnection($connectionString)
          $integrationServices = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices($sqlConnection)
          $catalog = $integrationServices.Catalogs["SSISDB"]
          
          # Automatically build catalog folder if missing
          if (-not $catalog.Folders[$env:SSIS_CATALOG_FOLDER]) {
              $folder = New-Object Microsoft.SqlServer.Management.IntegrationServices.CatalogFolder($catalog, $env:SSIS_CATALOG_FOLDER, "Timesheet Data Migration Folder")
              $folder.Create()
          } else {
              $folder = $catalog.Folders[$env:SSIS_CATALOG_FOLDER]
          }
          
          # Read and deploy compiled .ispac file from the dynamically found path
          $ispacPath = $env:RESOLVED_ISPAC_PATH
          Write-Host "Reading compiled file from: $ispacPath"
          
          if (-not (Test-Path $ispacPath)) {
              Write-Error "Compiled .ispac file was not found at $ispacPath! Check Visual Studio build output."
              exit 1
          }
          
          [byte[]]$projectBytes = [System.IO.File]::ReadAllBytes($ispacPath)
          
          Write-Host "Deploying project to local catalog folder..."
          $folder.DeployProject($env:SSIS_PROJECT_NAME, $projectBytes)
          Write-Host "SSIS project deployed successfully to database: ${{ env.TARGET_DATABASE }}."
