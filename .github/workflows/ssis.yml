name: Automation SSIS
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build-and-deploy:
    runs-on: [self-hosted, SAMBE2025001]
 
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: false  
 
    # =========================================================================
    # PHASE 0: AUTOMATIC DATABASE & TABLE CREATION (TARGETING TIMESHEETDB)
    # =========================================================================
    - name: Ensure Database and Schema Tables Exist
      shell: powershell
      run: |
        # 💡 CLEANED: Points directly to your specific file inside SQL Project only
        $sqlScriptFile = "${{ github.workspace }}\SQL Project\Create_Database_And_Tables.sql"
        
        sqlcmd -S "." -d "master" -E -b -i "$sqlScriptFile"
        if ($LASTEXITCODE -ne 0) { Throw "TimesheetDB initialization script failed." }

    # ==========================================
    # PHASE 1: CONTINUOUS INTEGRATION (COMPILATION VIA DEVENV)
    # ==========================================
    - name: Locate Visual Studio DevEnv Tool
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        if (-not $vsPath) {
            $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        }
        $devenvDir = Split-Path $vsPath
        $devenvCom = Join-Path $devenvDir "devenv.com"
       
        if (Test-Path $devenvCom) {
            Write-Host "Found Visual Studio compiler at: $devenvCom"
            echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "CRITICAL ERROR: Visual Studio (devenv.com) was not found on this self-hosted runner."
        }
 
    - name: Build SSIS Project to ISPAC
      shell: powershell
      run: |
        $dtprojPath = "${{ github.workspace }}\Timesheet_Project\TimesheetMigration\TimesheetMigration\TimesheetMigration.dtproj"
        & "${{ env.DEVENV_PATH }}" "$dtprojPath" /Build "Development"
       
        $targetIspacPath = "${{ github.workspace }}\Timesheet_Project\TimesheetMigration\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
        if (Test-Path $targetIspacPath) {
            Write-Host "Success: .ispac deployment bundle created cleanly."
            echo "ISPAC_PATH=$targetIspacPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "Build completed, but the compiled .ispac artifact was not found inside the target bin path."
        }
 
    - name: Upload Compiled Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ssis-deployment-package
        path: ${{ env.ISPAC_PATH }}
 
    # ==========================================
    # PHASE 2: CONTINUOUS DEPLOYMENT (ZERO-PASSWORD INJECTION)
    # ==========================================
    - name: Deploy to SSISDB Catalog
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: powershell
      run: |
        $projectPath = "${{ env.ISPAC_PATH }}"
        $folderName = "TimesheetDeployments"
        $projectName = [System.IO.Path]::GetFileNameWithoutExtension($projectPath)
        
        Write-Host "Reading $projectName binary package data..."
        $fileBytes = [System.IO.File]::ReadAllBytes($projectPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        
        $sqlScriptPath = "${{ github.workspace }}\deploy_execution_temp.sql"
        
        $sqlQuery = @"
        SET NOCOUNT ON;
        IF NOT EXISTS (SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = '$folderName')
        BEGIN
            EXEC [SSISDB].[catalog].[create_folder] @folder_name = '$folderName';
        END
        DECLARE @project_binary VARBINARY(MAX) = $hexString;
        EXEC [SSISDB].[catalog].[deploy_project]
            @folder_name = '$folderName',
            @project_name = '$projectName',
            @project_stream = @project_binary;
        "@
        
        $sqlQuery | Out-File -FilePath $sqlScriptPath -Encoding ascii -Force
        
        Write-Host "Executing deployment query directly via trusted local loopback..."
        sqlcmd -S "." -d "master" -E -b -i "$sqlScriptPath"
        
        if ($LASTEXITCODE -ne 0) {
            Throw "SQL deployment script failed during execution. Check SSMS catalog status."
        }
        
        Write-Host "SUCCESS: Deployment completed! Your SSIS project is now live in SSMS."
        if (Test-Path $sqlScriptPath) { Remove-Item $sqlScriptPath -Force }

    # =========================================================================
    # PHASE 3: CREATE AGENT JOB & SCHEDULE IT FOR MON-FRI, 8AM-5PM ON A 1-MIN LOOP
    # =========================================================================
    - name: Configure 1-Minute SQL Agent Automated Scheduling Engine Job
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: powershell
      run: |
        $jobScriptPath = "${{ github.workspace }}\agent_job_temp.sql"
        
        $jobQuery = @"
        USE msdb;
        GO

        IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'Run_Timesheet_ETL_Job')
        BEGIN
            EXEC dbo.sp_delete_job @job_name = N'Run_Timesheet_ETL_Job', @delete_unused_schedule = 1;
        END;

        EXEC dbo.sp_add_job 
            @job_name = N'Run_Timesheet_ETL_Job', 
            @enabled = 1, 
            @description = N'Runs the automated timesheet SSIS project workflow completely hands-free.',
            @category_name = N'[Uncategorized (Local)]',
            @owner_login_name = N'sa';

        EXEC msdb.dbo.sp_add_jobstep 
            @job_name = N'Run_Timesheet_ETL_Job', 
            @step_name = N'Execute_SSIS_Timesheet_Package', 
            @step_id = 1, 
            @cmdexec_success_code = 0, 
            @on_success_action = 1, 
            @on_fail_action = 2,    
            @subsystem = N'SSIS',   
            @command = N'/ISSERVER "\"\SSISDB\TimesheetDeployments\TimesheetMigration\Package.dtsx\"" /SERVER "\".\""',
            @database_name = N'master';

        EXEC dbo.sp_add_jobschedule 
            @job_name = N'Run_Timesheet_ETL_Job', 
            @name = N'Timesheet_One_Minute_Interval_Schedule', 
            @enabled = 1, 
            @freq_type = 8,              
            @freq_interval = 62,         
            @freq_subday_type = 4,       
            @freq_subday_interval = 1,   
            @freq_recurrence_factor = 1, 
            @active_start_time = 080000, 
            @active_end_time = 170000;   

        EXEC dbo.sp_add_jobserver @job_name = N'Run_Timesheet_ETL_Job', @server_name = N'(local)';
        "@
        
        $jobQuery | Out-File -FilePath $jobScriptPath -Encoding ascii -Force
        
        sqlcmd -S "." -d "master" -E -b -i "$jobScriptPath"
        if ($LASTEXITCODE -ne 0) { Throw "Failed to build or schedule the SQL Server Agent Job." }
        if (Test-Path $jobScriptPath) { Remove-Item $jobScriptPath -Force }
