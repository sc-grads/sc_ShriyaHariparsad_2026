name: Database Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  notify-approval:
    runs-on: windows-latest

    steps:
      - name: Send Teams Approval Request
        shell: powershell
        run: |
          $payload = @{
            text = "Database deployment approval required. Please approve the production deployment in GitHub."
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  deploy-database:
    needs: notify-approval

    runs-on: windows-latest

    environment:
      name: production

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.PROJECT_URL }}" `
            -d "${{ secrets.DATABASE_NAME }}" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"
