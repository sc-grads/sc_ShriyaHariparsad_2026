name: Automation SSIS
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build-and-deploy:
    runs-on: self-hosted
 
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: false  
 
    # ==========================================
    # PHASE 1: CONTINUOUS INTEGRATION (COMPILATION VIA DEVENV)
    # ==========================================
    - name: Locate Visual Studio DevEnv Tool
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        if (-not $vsPath) {
            $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        }
        $devenvDir = Split-Path $vsPath
        $devenvCom = Join-Path $devenvDir "devenv.com"
       
        if (Test-Path $devenvCom) {
            Write-Host "Found Visual Studio compiler at: $devenvCom"
            echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "CRITICAL ERROR: Visual Studio (devenv.com) was not found on this self-hosted runner."
        }
 
    - name: Build SSIS Project to ISPAC
      shell: powershell
      run: |
        # LEFT ALONE PER REQUEST: Your direct C drive project path
        & "${{ env.DEVENV_PATH }}" "C:\sc_ShriyaHariparsad_2026\Timesheet_Project\TimesheetMigration\TimesheetMigration\TimesheetMigration.dtproj" /Build "Development"
       
        # UPDATED: Targets the dynamic output path matching the project folder location on C:\
        $targetIspacPath = "C:\sc_ShriyaHariparsad_2026\Timesheet_Project\TimesheetMigration\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
        if (Test-Path $targetIspacPath) {
            Write-Host "Success: .ispac deployment bundle created cleanly."
        } else {
            Throw "Build completed, but the compiled .ispac artifact was not found inside the target bin path."
        }
 
    - name: Upload Compiled Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ssis-deployment-package
        path: C:\sc_ShriyaHariparsad_2026\Timesheet_Project\TimesheetMigration\TimesheetMigration\bin\Development\TimesheetMigration.ispac
 
    # ==========================================
    # PHASE 2: CONTINUOUS DEPLOYMENT (LOCAL LOOPBACK PORT INJECTION)
    # ==========================================
    - name: Deploy to SSISDB Catalog
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: powershell
      run: |
        # Use the verified connection string path that successfully hit the database interface
        $connectionString = "Server=127.0.0.1,1433;Database=master;Integrated Security=True;TrustServerCertificate=True;"
        $folderName = "TimesheetDeployments"
       
        # UPDATED: Points directly to your machine's physical build directory
        $projectPath = "C:\sc_ShriyaHariparsad_2026\Timesheet_Project\TimesheetMigration\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
        $projectName = [System.IO.Path]::GetFileNameWithoutExtension($projectPath)
       
        Write-Host "Reading $projectName binary package data from: $projectPath"
        $fileBytes = [System.IO.File]::ReadAllBytes($projectPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
 
        Write-Host "Deploying directly via internal database port mapping..."
       
        $deployQuery = "
        SET NOCOUNT ON;
        IF NOT EXISTS (SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = '$folderName')
        BEGIN
            EXEC [SSISDB].[catalog].[create_folder] @folder_name = '$folderName';
        END
        DECLARE @project_binary VARBINARY(MAX) = $hexString;
        EXEC [SSISDB].[catalog].[deploy_project]
            @folder_name = '$folderName',
            @project_name = '$projectName',
            @project_stream = @project_binary;
        "
 
        $connection = New-Object System.Data.SqlClient.SqlConnection($connectionString)
        $command = New-Object System.Data.SqlClient.SqlCommand($deployQuery, $connection)
       
        try {
            $connection.Open()
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: Deployment completed! Your SSIS project is now live in SSMS."
        } catch {
            Throw "Database connection crashed: $_"
        } finally {
            $connection.Close()
        }
