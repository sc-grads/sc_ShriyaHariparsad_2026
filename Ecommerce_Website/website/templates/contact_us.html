{% extends 'base.html' %}

{% block title %} Contact Us {% endblock %}

{% block body %}
<div class="container my-5 text-dark" style="background-color: #ffffff; padding: 40px; border-radius: 12px; border: 1px solid #fbcfe8; box-shadow: 0 4px 12px rgba(219,39,119,0.02); font-family: sans-serif;">
    <h2 class="mb-4" style="color: #1e293b; font-weight: 800; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; font-size: 32px;">Contact Our Support Team</h2>
    <div class="row">
        <div class="col-md-6 mb-4">
            <h4 style="color: #db2777; font-size: 18px; margin-bottom: 15px; font-weight: 700;">Get In Touch</h4>
            <p style="font-size: 15px; color: #475569;"><i class="fas fa-envelope me-2" style="color: #db2777;"></i> support@starlighttech.co.za</p>
            <p style="font-size: 15px; color: #475569;"><i class="fas fa-phone me-2" style="color: #db2777;"></i> +27 (0) 31 566 0123</p>
            <p style="font-size: 15px; color: #475569;"><i class="fas fa-map-marker-alt me-2" style="color: #db2777;"></i> Shop 12, Zenith Drive, Umhlanga Ridge, Durban, 4319</p>
        </div>
        <div class="col-md-6">
            <h4 style="color: #db2777; font-size: 18px; margin-bottom: 15px; font-weight: 700;">Send Us A Message</h4>
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you! Your message has been received.'); this.reset();">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Your Name" required style="border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; background-color: #ffffff; color: #2d3748;">
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Your Email" required style="border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; background-color: #ffffff; color: #2d3748;">
                </div>
                <div class="mb-3">
                    <textarea class="form-control" rows="4" placeholder="Your Message" required style="border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; background-color: #ffffff; color: #2d3748;"></textarea>
                </div>
                <button type="submit" class="btn text-white" style="background-color: #db2777; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(219,39,119,0.15);">Send Inquiry</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
