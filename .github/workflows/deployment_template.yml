name: Database Deployment Template

on:
  workflow_call:
    secrets:
      PROJECT_URL:
        required: true
      USER_NAME:
        required: true
      PASSWORD_SQL:
        required: true
      TEAMS_WEBHOOK_URL:
        required: true

jobs:

  deploy-production:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: windows-latest

    environment:
      name: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        shell: powershell
        run: |
          echo "ENV_NAME=production" >> $env:GITHUB_OUTPUT

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.PROJECT_URL }}" `
            -d "master" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"

      - name: Notify Production Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "DATABASE DEPLOYMENT - FAILED`n`nCreator: Shriya`n`nBranch: ${{ github.ref_name }}`n`nEnvironment: Production`n`nDate: $(Get-Date -Format 'yyyy-MM-dd')`n`nProduction deployment failed."
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  deploy-buhle:
    if: github.ref_name == 'staging'
    needs: deploy-production
    runs-on: windows-latest

    environment:
      name: Buhle

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Approval Request (Teams)
        shell: powershell
        run: |
          $payload = @{
            text = "PARTNER DATABASE DEPLOYMENT - APPROVAL REQUIRED`n`nCreator: Shriya`n`nBranch: ${{ github.ref_name }}`n`nEnvironment: Buhle`n`nDate: $(Get-Date -Format 'yyyy-MM-dd')`n`nApproval required before deployment."
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.PROJECT_URL }}" `
            -d "master" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "DATABASE DEPLOYMENT - SUCCESS`n`nCreator: Shriya`n`nBranch: ${{ github.ref_name }}`n`nEnvironment: Buhle`n`nDate: $(Get-Date -Format 'yyyy-MM-dd')`n`nProduction and Partner deployments completed successfully."
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "DATABASE DEPLOYMENT - FAILED`n`nCreator: Shriya`n`nBranch: ${{ github.ref_name }}`n`nEnvironment: Buhle`n`nDate: $(Get-Date -Format 'yyyy-MM-dd')`n`nPartner deployment failed."
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  notify-main-success:
    if: github.ref_name == 'main'
    needs: deploy-production
    runs-on: windows-latest

    environment:
      name: production

    steps:
      - name: Notify Success
        shell: powershell
        run: |
          $payload = @{
            text = "DATABASE DEPLOYMENT - SUCCESS`n`nCreator: Shriya`n`nBranch: ${{ github.ref_name }}`n`nEnvironment: Production`n`nDate: $(Get-Date -Format 'yyyy-MM-dd')`n`nDeployment completed successfully."
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
