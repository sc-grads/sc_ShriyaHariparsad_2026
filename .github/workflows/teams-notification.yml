name: GitHub to Teams Notifications

on:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  pull_request_review:
    types: [submitted]
  push:
    branches:
      - "main"
  create:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams notification
        run: |
          EVENT="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"
          REVIEW_STATE="${{ github.event.review.state }}"
          TEXT=""
          DETAILS=""

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$ACTION" = "opened" ]; then
              TEXT="New Pull Request Opened"
            elif [ "$ACTION" = "reopened" ]; then
              TEXT="Pull Request Reopened"
            elif [ "$ACTION" = "synchronize" ]; then
              TEXT="Pull Request Updated"
            elif [ "$ACTION" = "closed" ]; then
              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                TEXT="Pull Request Merged into main"
              else
                TEXT="Pull Request Closed (not merged)"
              fi
            fi
            DETAILS="Repo: ${{ github.repository }} | Title: ${{ github.event.pull_request.title }} | Author: ${{ github.actor }}"

          elif [ "$EVENT" = "pull_request_review" ]; then
            # Only send notification if the review is an approval
            if [ "$REVIEW_STATE" = "approved" ]; then
              TEXT="Pull Request Approved"
              DETAILS="Repo: ${{ github.repository }} | Title: ${{ github.event.pull_request.title }} | Approved By: ${{ github.actor }}"
            else
              echo "Review state is $REVIEW_STATE, not approved. Skipping notification."
              exit 0
            fi

          elif [ "$EVENT" = "push" ]; then
            TEXT="Push to ${{ github.ref_name }}"
            DETAILS="Repo: ${{ github.repository }} | Commit: ${{ github.sha }}"

          elif [ "$EVENT" = "create" ]; then
            # Verify the created resource is a branch, not a tag
            if [ "${{ github.event.ref_type }}" = "branch" ]; then
              TEXT="New Branch Created: ${{ github.ref_name }}"
              DETAILS="Repo: ${{ github.repository }} | Created By: ${{ github.actor }}"
            else
              echo "Created resource is a tag, not a branch. Skipping notification."
              exit 0
            fi
          fi

          # Re-engineered payload directly targeting New Teams Power Automate Workflows
          PAYLOAD=$(jq -n --arg text "$TEXT" --arg details "$DETAILS" '{
            "type": "AdaptiveCard",
            "body": [
              {
                "type": "TextBlock",
                "size": "Medium",
                "weight": "Bolder",
                "text": $text
              },
              {
                "type": "TextBlock",
                "text": $details,
                "wrap": true
              }
            ],
            "$schema": "http://adaptivecards.io",
            "version": "1.4"
          }')
          
          # Send payload and echo output response to catch hidden API errors
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}")
               
          echo "=== Teams API Output ==="
          echo "$RESPONSE"
          echo "========================"
