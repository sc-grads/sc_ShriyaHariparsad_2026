name: Deploy Database
 
on:
  push:
    branches:
      - main
 
jobs:
  deploy:
    runs-on: windows-latest
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Install SQLCMD
        uses: potatoqualitee/mssqlsuite@v1.7
        with:
          install: sqlclient
 
      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd -S "${{ secrets.PROJECT_URL }}" -d "${{ secrets.DATABASE_NAME }}" -U "${{ secrets.USER_NAME }}" -P "${{ secrets.PASSWORD_SQL }}" -C -i "database/deploy.sql"
