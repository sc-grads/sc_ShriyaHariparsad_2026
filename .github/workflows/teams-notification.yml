name: GitHub to Teams Notifications

on:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  push:
    branches:
      - "main"
  create:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams notification
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IS_MERGED: ${{ github.event.pull_request.merged }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TEXT=""
          DETAILS=""

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$ACTION" = "opened" ]; then TEXT="New Pull Request Opened"; fi
            if [ "$ACTION" = "reopened" ]; then TEXT="Pull Request Reopened"; fi
            if [ "$ACTION" = "synchronize" ]; then TEXT="Pull Request Updated"; fi
            if [ "$ACTION" = "closed" ]; then
              if [ "$IS_MERGED" = "true" ]; then
                TEXT="Pull Request Merged into main"
              else
                TEXT="Pull Request Closed (not merged)"
              fi
            fi
            DETAILS="Repo: $REPO | Title: $PR_TITLE | Author: $ACTOR"

          elif [ "$EVENT" = "push" ]; then
            TEXT="Push to $REF_NAME"
            DETAILS="Repo: $REPO | Commit: $COMMIT_SHA"

          elif [ "$EVENT" = "create" ]; then
            TEXT="New Branch Created: $REF_NAME"
            DETAILS="Repo: $REPO"
          fi

          # Standard default Power Automate parsing JSON structure
          PAYLOAD=$(jq -n \
            --arg text "$TEXT" \
            --arg details "$DETAILS" \
            '{title: $text, text: $details}')

          # Executing curl with "-i" to track precise server response codes
          curl -i -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"

 
