name: GitHub-MS Teams Events Integration
 
on:
  push:
  pull_request:
    types: [opened, review_requested, closed]
  create:
  pull_request_review:
    types: [submitted]
 
jobs:
  notify-teams:
    runs-on: ubuntu-latest
 
    steps:
      - name: Send message to MS Teams
        run: |
          EVENT_NAME="${{ github.event_name }}"
 
          if [ "$EVENT_NAME" = "push" ]; then
            MESSAGE=" Push event in ${{ github.repository }} by ${{ github.actor }}.\n\nCommit: ${{ github.event.head_commit.message }}\n${{ github.event.head_commit.url }}"
         
          elif [ "$EVENT_NAME" = "create" ]; then
            MESSAGE=" Create event in ${{ github.repository }} by ${{ github.actor }}.\nRef: ${{ github.ref }}"
 
          elif [ "$EVENT_NAME" = "create" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            MESSAGE=" New Branch Created in ${{ github.repository }} by ${{ github.actor }}.Branch Name: ${{ github.ref }} Repository: ${{ github.repository }}"  
         
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "opened" ]; then
            MESSAGE=" Pull Request Created in ${{ github.repository }} by ${{ github.actor }}.\n\nTitle: ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}"
         
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "review_requested" ]; then
            MESSAGE=" Approval Requested in ${{ github.repository }}.\n\nCreated By: ${{ github.event.pull_request.user.login }}\nReviewer: ${{ github.event.requested_reviewer.login }}\nStatus: Review Requested\n${{ github.event.pull_request.html_url }}"
         
          elif [ "${{ github.event_name }}" = "pull_request_review" ] && [ "${{ github.event.review.state }}" = "approved" ]; then
            MESSAGE=" Pull Request Approved in ${{ github.repository }}.\n\nApproved By: ${{ github.actor }}\nPR Author: ${{ github.event.pull_request.user.login }}\nStatus: Approved\n${{ github.event.pull_request.html_url }}"
         
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            MESSAGE=" Pull Request Merged in ${{ github.repository }}.\n\nMerged By: ${{ github.actor }}\nTitle: ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}"
         
     
         
          else
            exit 0
          fi
 
          curl -H "Content-Type: application/json" \
          -d "{\"text\": \"$MESSAGE\"}" \
          "${{ secrets.TEAMS_WEBHOOK }}"
