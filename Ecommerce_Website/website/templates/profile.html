{% extends 'base.html' %}

{% block title %} Home {% endblock %}

{% block body %}
<div class="container my-5" style="font-family: sans-serif;">
    <div class="row">
        <h3 style="color: #1e293b; font-weight: 800; font-size: 32px; margin-bottom: 30px;">Welcome <span class="text-capitalize">{{ customer.first_name }} {{ customer.last_name }}</span></h3>

        <div style="display: flex; gap: 30px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; width: 100%;">
            
            <!-- BUTTONS PANEL (LEFT) -->
            <div style="flex: 1; min-width: 220px; max-width: 260px; margin-top: 50px;">
                <ul class="list-unstyled" style="margin: 0; padding: 0;">
                    <li class="d-grid"><a href="#" class="btn text-white" style="background-color: #db2777; border: none; padding: 12px; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 6px rgba(219,39,119,0.15); text-align: center; text-decoration: none;">Profile</a></li>
                    <li class="d-grid"><a href="/change-password/{{ customer.id }}" class="btn text-white" style="background-color: #db2777; border: none; padding: 12px; font-weight: bold; border-radius: 8px; margin-top: 12px; box-shadow: 0 4px 6px rgba(219,39,119,0.15); text-align: center; text-decoration: none;">Change Password</a></li>
                </ul>
            </div>

            <!-- ACCOUNT CARD PANEL (RIGHT) -->
            <div style="flex: 2; min-width: 320px; background-color: #ffffff; border: 1px solid #fbcfe8; color: #2d3748; border-radius: 12px; padding: 24px; box-shadow: 0 4px 12px rgba(219,39,119,0.02);">
                <form method="POST" action="/profile/{{ customer.id }}" style="display: flex; flex-direction: column; gap: 16px;">
                    <h3 style="margin: 0; font-family: sans-serif; color: #1e293b; font-weight: 700; font-size: 24px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">Customer Profile</h3>
                    
                    <div style="display: flex; gap: 16px;">
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                            <label style="font-size: 14px; font-weight: 600; color: #334155;">First Name</label>
                            <input type="text" name="first_name" value="{{ customer.first_name }}" required pattern="[A-Za-z\s]+" oninvalid="this.setCustomValidity('First name must contain letters only.')" oninput="this.setCustomValidity('')" class="form-control" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 15px; color: #334155;">
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                            <label style="font-size: 14px; font-weight: 600; color: #334155;">Last Name</label>
                            <input type="text" name="last_name" value="{{ customer.last_name }}" required pattern="[A-Za-z\s]+" oninvalid="this.setCustomValidity('Last name must contain letters only.')" oninput="this.setCustomValidity('')" class="form-control" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 15px; color: #334155;">
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 14px; font-weight: 600; color: #334155;">ID Number</label>
                        <input type="text" name="id_number" value="{{ customer.id_number }}" required pattern="\d{13}" maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '')" title="ID number must be exactly 13 digits long" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 15px; color: #334155;">
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 14px; font-weight: 600; color: #334155;">Email Address</label>
                        <input type="email" name="email" value="{{ customer.email }}" required class="form-control" title="Please enter a valid email address (e.g. user@domain.com)" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 15px; color: #334155;">
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #f1f5f9; padding-top: 12px; margin-top: 4px;">
                        <h4 style="margin: 0 0 4px 0; font-family: sans-serif; color: #475569; font-weight: 700; font-size: 16px;">Delivery Information</h4>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 14px; font-weight: 600; color: #334155;">Street Address</label>
                        <input type="text" name="street_address" value="{{ customer.street_address if customer.street_address else '' }}" placeholder="e.g., 42 Strand Street" class="form-control" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 15px; color: #334155;">
                    </div>

                    <div style="display: flex; gap: 16px;">
                        <div style="flex: 2; display: flex; flex-direction: column; gap: 6px;">
                            <label style="font-size: 14px; font-weight: 600; color: #334155;">City / Suburb</label>
                            <input type="text" name="city" value="{{ customer.city if customer.city else '' }}" placeholder="e.g., Cape Town" class="form-control" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 15px; color: #334155;">
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                            <label style="font-size: 14px; font-weight: 600; color: #334155;">Postal Code</label>
                            <input type="text" name="postal_code" value="{{ customer.postal_code if customer.postal_code else '' }}" placeholder="e.g., 8001" class="form-control" pattern="\d{4}" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '')" title="Postal code must be exactly 4 digits long" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 15px; color: #334155;">
                        </div>
                    </div>

                    <div style="margin-top: 10px;">
                        <button type="submit" class="btn text-white w-100" style="background-color: #db2777; border: none; padding: 12px; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 6px rgba(219,39,119,0.15); cursor: pointer;">Update Details</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
