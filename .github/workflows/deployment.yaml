name: Database Deployment

on:
  push:
    branches:
      - main
      - staging

  workflow_dispatch:

jobs:
  deploy-database:
    runs-on: windows-latest

    # 🌟 THIS SECURELY FORCES GITHUB TO FETCH THE CORRECT ENVIROMENT SECRETS IMMEDIATELY
    environment: ${{ github.ref_name == 'main' && 'production' || 'Buhle' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Approval Request Notification (Teams)
        shell: powershell
        run: |
          $payload = @{
            text = "APPROVAL REQUESTED 🚨`nBranch: ${{ github.ref_name }}`nEnvironment: ${{ github.ref_name == 'main' && 'production' || 'Buhle' }}`nPlease verify details in GitHub Environments."
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.SERVER_SQL }}" `
            -d "master" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "SUCCESS`nBranch: ${{ github.ref_name }}`nTarget Database updated successfully."
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "FAILED ❌`nBranch: ${{ github.ref_name }}`nPlease check execution logs for connection blocks."
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
