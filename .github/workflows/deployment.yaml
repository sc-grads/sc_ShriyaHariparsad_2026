name: Database Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  notify-approval:
    runs-on: windows-latest

    steps:
      - name: Send Teams Approval Request
        shell: powershell
        run: |
          $payload = @{
            text = "Database deployment approval required.`nCreator: ${{ github.actor }}`nPlease approve in GitHub Environment: production"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  deploy-database:
    needs: notify-approval
    runs-on: windows-latest

    environment:
      name: production

    steps:

      - name: Notify Approval Received
        shell: powershell
        run: |
          $payload = @{
            text = "Approval received.`nCreator: ${{ github.actor }}`nDeployment is starting now."
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.PROJECT_URL }}" `
            -d "master" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"

      - name: Notify Teams on Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "SUCCESS: Database deployment completed.`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Teams on Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "FAILED: Database deployment failed.`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
