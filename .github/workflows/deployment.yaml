name: Database Deployment Template

on:
  workflow_call:
    secrets:
      PROJECT_URL:
        required: true
      USER_NAME:
        required: true
      PASSWORD_SQL:
        required: true
      TEAMS_WEBHOOK_URL:
        required: true

jobs:

  deploy-database:
    runs-on: windows-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'Buhle' }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        shell: powershell
        run: |
          if ("${{ github.ref_name }}" -eq "main") {
            echo "ENV_NAME=production" >> $env:GITHUB_OUTPUT
          } else {
            echo "ENV_NAME=Buhle" >> $env:GITHUB_OUTPUT
          }

      - name: Send Approval Request (Teams)
        if: github.ref_name == 'staging'
        shell: powershell
        run: |
          $payload = @{
            text = "DATABASE DEPLOYMENT APPROVAL REQUIRED`n`nBranch: ${{ github.ref_name }}`nEnvironment: ${{ steps.env.outputs.ENV_NAME }}`nTime: $(Get-Date)"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.PROJECT_URL }}" `
            -d "master" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "DEPLOYMENT SUCCESSFUL`n`nBranch: ${{ github.ref_name }}`nEnvironment: ${{ steps.env.outputs.ENV_NAME }}`nTime: $(Get-Date)"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "DEPLOYMENT FAILED`n`nBranch: ${{ github.ref_name }}`nEnvironment: ${{ steps.env.outputs.ENV_NAME }}`nTime: $(Get-Date)"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
